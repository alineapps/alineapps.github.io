<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Daybeam Reader</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1c1c1e; --sub: #6e6e73; --accent: #c77c00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0b; --fg: #f2f2f7; --sub: #98989d; --accent: #ffb340; } }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; text-align: center; }
  p { margin: 0 auto 12px; max-width: 28em; }
  .sub { color: var(--sub); font-size: 15px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<p>Daybeam Reader に戻ります…</p>
<p class="sub">Returning to Daybeam Reader…</p>
<p class="sub"><a id="open" href="daybeamreader://instapaper/callback">アプリを開く / Open the app</a></p>
<script>
  // Instapaper sends the user back here with ?code=…&state=… (or ?error=…). This page keeps
  // nothing and loads nothing else; it only hands the query to the app's own URL scheme.
  (function () {
    var target = 'daybeamreader://instapaper/callback' + window.location.search;
    document.getElementById('open').setAttribute('href', target);
    window.location.replace(target);
  })();
</script>
</body>
</html>
